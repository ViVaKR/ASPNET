syntax = "proto3";

// [조직 또는 솔루션 루트].[도메인 또는 기능].[버전]}
package demo.aichat.v1

// 닷넷에서만 사용시 카멜케이스 권장
option csharp_namespace = "Demo.Contracts.AiChat.V1"

service ChatService {
  rpc Ask(Ask(Request) returns (stream AskResponse));
}

message ChatMessage {

  // "user" | "assistant"
  string role = 1;
  string content = 2;
}

// class AskRequest
message AskRequest {

  // string Question
  string question = 1;

  // 이전 대화
  // RepeatedField<T>
  // RepeatedField<ChatMessage> History
  repeated ChatMessage history = 2;
}

message AskResponse {
  string text = 1;

  // bool IsThinking
  // true : 사고과정 토큰
  bool is_thinking = 2;
}
